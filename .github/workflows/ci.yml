name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Windows runner 的 Python 默认按系统区域编码（cp1252）输出 stdout，
# 打印中文会抛 UnicodeEncodeError。强制 UTF-8 模式，跨平台行为一致。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash
        # 包目录（仓库根即包目录）在 workspace 下名为 cordis_port，
        # 因此默认在包目录内执行；需要从「父目录」导入的步骤会单独覆盖为 '.'。
        working-directory: cordis_port

    steps:
      # 本项目采用「仓库根目录即包目录」的扁平布局，包名为 cordis_port。
      # 这里显式检出到 workspace 下的 cordis_port/，使 workspace 根目录
      # 正好成为可导入 cordis_port 的 sys.path 根。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: cordis_port

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 目录布局检查
        run: |
          echo "包目录: $(pwd)  (basename: $(basename "$(pwd)"))"
          test "$(basename "$(pwd)")" = "cordis_port" \
            || { echo "错误: 检出目录名不是 cordis_port，import cordis_port 将失败"; exit 1; }
          test -f __init__.py || { echo "错误: 未在包目录中运行"; exit 1; }
          echo "布局检查通过"

      - name: 语法检查
        run: |
          python - <<'PY'
          import ast, pathlib
          files = sorted(pathlib.Path(".").glob("*.py"))
          for f in files:
              ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
          print(f"语法检查通过: {len(files)} 个文件")
          PY

      - name: 导入与导出表检查
        working-directory: .
        run: |
          python -c "
          import cordis_port
          missing = [n for n in cordis_port.__all__ if not hasattr(cordis_port, n)]
          assert not missing, f'__all__ 中存在未定义的名字: {missing}'
          print(f'导入通过: {len(cordis_port.__all__)} 个导出')
          "

      - name: 构建并安装 wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel
          pip install dist/*.whl

      - name: 安装版导入验证（在仓库外执行，确保来自 site-packages）
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import cordis_port, inspect, os
          path = os.path.dirname(inspect.getfile(cordis_port))
          print('包路径:', path)
          assert 'site-packages' in path, f'未从 site-packages 导入: {path}'
          print('安装版导入通过, 导出数:', len(cordis_port.__all__))
          "

      - name: 冒烟测试
        working-directory: .
        run: |
          python - <<'PY'
          import asyncio
          from cordis_port import Context, Service


          class Counter(Service):
              provide = "counter"

              def __init__(self, ctx, config=None):
                  super().__init__(ctx)
                  self.n = 0

              def inc(self):
                  self.n += 1
                  return self.n


          class Provider:
              def __init__(self, ctx, config=None):
                  self.ctx = ctx

              def init(self):
                  Counter(self.ctx)


          async def main():
              ctx = Context()

              # 插件加载
              fiber = ctx.plugin(Provider)
              await fiber
              assert fiber.get_state().name == "ACTIVE"

              # 服务访问
              assert ctx.counter.inc() == 1

              # 依赖注入
              injected = []

              class Consumer:
                  inject = ["counter"]

                  def __init__(self, ctx, config=None):
                      self.ctx = ctx

                  def init(self):
                      injected.append(self.ctx.counter.n)

              await ctx.plugin(Consumer)
              assert injected == [1], injected

              # 五种事件派发
              seen = []
              ctx.on("e", lambda x: seen.append(x))
              ctx.emit("e", "a")
              assert seen == ["a"]

              ctx.on("p", lambda: None)
              ctx.on("p", lambda: "first")
              assert await ctx.serial("p") == "first"
              assert ctx.bail("p") == "first"

              await ctx.parallel("e", "b")
              assert seen == ["a", "b"]

              ctx.on("w", lambda nxt: nxt() + 1)
              assert ctx.waterfall("w", lambda: 41) == 42

              # 副作用随 fiber 卸载自动清理
              cleaned = []

              class Lifecycle:
                  def __init__(self, ctx, config=None):
                      self.ctx = ctx

                  def init(self):
                      self.ctx.on("t", lambda: None)
                      return lambda: cleaned.append("done")

              lf = ctx.plugin(Lifecycle)
              await lf
              r = lf.dispose()
              if hasattr(r, "__await__"):
                  await r
              assert cleaned == ["done"], cleaned

              print("冒烟测试全部通过")


          asyncio.run(main())
          PY
